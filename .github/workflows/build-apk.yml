name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Expand Swap Space to 10GB
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Release APK
        run: |
          ./gradlew assembleRelease --stacktrace > build_log.txt 2>&1 || { tail -n 80 build_log.txt; exit 1; }

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minipolyclinic-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Deploy Release APK to Repository
        run: |
          cp app/build/outputs/apk/release/app-release.apk ShweKhitClinic-debug.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ShweKhitClinic-debug.apk version.json
          git commit -m "chore(release): update APK and version.json to v1.5.49 [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
